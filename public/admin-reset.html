<html lang="vi">
<head>

<title>Admin · Bảng điều khiển sự kiện</title>

<script>window.location.replace('/admin/');</script>
<link rel="stylesheet" href="/css/theme.css" />
<style>
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
  }
  .redirect {
    text-align: center;
    padding: 28px 32px;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface);
  }
  .redirect p { margin: 0 0 14px; color: var(--muted); }
  .redirect a {
    display: inline-block;
    padding: 10px 18px;
    border-radius: var(--r-sm);
    background: var(--accent);
    color: #fff;
    font-weight: 650;
    text-decoration: none;
  }

</head>
<body>
  <div class="redirect">
    <p>Trang admin đã chuyển sang địa chỉ mới.</p>
